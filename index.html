<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planejador Inteligente de Presencial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .day-card { transition: all 0.15s ease-in-out; user-select: none; }
    .day-card:hover:not(.disabled-day) { transform: translateY(-2px); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-5">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight">Planejador Inteligente de Presencial</h1>
        <p class="text-slate-400 text-sm mt-1">Feriados oficiais via API, geolocalização por município, banco de horas e Google Agenda.</p>
      </div>
      
      <!-- Seletor de Mês/Ano -->
      <div class="flex items-center gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-800">
        <button id="prevMonth" class="p-2 hover:bg-slate-800 rounded-lg text-slate-300 transition" title="Mês anterior">&larr;</button>
        <span id="currentMonthLabel" class="font-semibold text-sm md:text-base px-3 min-w-[150px] text-center capitalize"></span>
        <button id="nextMonth" class="p-2 hover:bg-slate-800 rounded-lg text-slate-300 transition" title="Próximo mês">&rarr;</button>
      </div>
    </header>

    <!-- Painel de Configuração e Localidade -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Controles, Local e Metas (5 colunas) -->
      <div class="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">1. Localidade & Feriados</h2>
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[11px] font-medium text-slate-400 block mb-1">Estado (UF)</label>
            <select id="stateSelect" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
              <option value="PE">Pernambuco (PE)</option>
            </select>
          </div>
          <div>
            <label class="text-[11px] font-medium text-slate-400 block mb-1">Município</label>
            <select id="citySelect" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
              <option value="Recife">Recife</option>
            </select>
          </div>
        </div>

        <hr class="border-slate-800">

        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">2. Configurar Meta</h2>
        
        <div class="grid grid-cols-2 gap-2 bg-slate-950 p-1 rounded-xl border border-slate-800">
          <button id="modePercentBtn" class="py-2 px-3 rounded-lg text-xs font-semibold transition bg-indigo-600 text-white">Por % do Mês</button>
          <button id="modeWeeklyBtn" class="py-2 px-3 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-white">Dias / Semana</button>
        </div>

        <div id="percentControl" class="space-y-1">
          <div class="flex justify-between text-xs">
            <label for="targetPercent" class="text-slate-300">Meta:</label>
            <span id="targetPercentVal" class="font-bold text-indigo-400">40%</span>
          </div>
          <input type="range" id="targetPercent" min="10" max="100" step="5" value="40" class="w-full accent-indigo-500 cursor-pointer">
        </div>

        <div id="weeklyControl" class="space-y-1 hidden">
          <div class="flex justify-between text-xs">
            <label for="targetWeekly" class="text-slate-300">Dias/Semana:</label>
            <span id="targetWeeklyVal" class="font-bold text-indigo-400">2 dias/sem</span>
          </div>
          <input type="range" id="targetWeekly" min="1" max="5" step="1" value="2" class="w-full accent-indigo-500 cursor-pointer">
        </div>

        <hr class="border-slate-800">

        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Dias Preferidos</span>
            <span class="text-[10px] text-slate-500">Para sugestão IA</span>
          </div>
          <div class="grid grid-cols-5 gap-1.5" id="favoriteDaysContainer">
            <button data-fav-dow="1" class="fav-day-btn py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-xs font-medium transition text-slate-400">Seg</button>
            <button data-fav-dow="2" class="fav-day-btn py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-xs font-medium transition text-slate-400">Ter</button>
            <button data-fav-dow="3" class="fav-day-btn py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-xs font-medium transition text-slate-400">Qua</button>
            <button data-fav-dow="4" class="fav-day-btn py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-xs font-medium transition text-slate-400">Qui</button>
            <button data-fav-dow="5" class="fav-day-btn py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-xs font-medium transition text-slate-400">Sex</button>
          </div>
          <button id="suggestDaysBtn" class="w-full py-2 px-3 rounded-xl bg-indigo-600/20 hover:bg-indigo-600/30 border border-indigo-5
