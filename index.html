<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planejador Inteligente de Presencial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .step-pane { display: none; }
    .step-pane.active { display: block; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">

  <div class="max-w-2xl w-full space-y-6">
    
    <!-- Header -->
    <header class="text-center space-y-2 border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-bold text-white tracking-tight">Planejador Inteligente de Presencial</h1>
      <p class="text-slate-400 text-xs">Organize sua escala de trabalho híbrido com feriados oficiais e sugestão inteligente.</p>
      
      <!-- Indicadores -->
      <div class="flex items-center justify-center gap-2 pt-2">
        <span id="ind1" class="px-3 py-1 rounded-full text-xs font-semibold bg-indigo-600 text-white">1. Local & Meta</span>
        <span class="text-slate-600">→</span>
        <span id="ind2" class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-900 text-slate-500 border border-slate-800">2. Preferências</span>
        <span class="text-slate-600">→</span>
        <span id="ind3" class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-900 text-slate-500 border border-slate-800">3. Calendário</span>
      </div>
    </header>

    <!-- Wizard Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl relative">
      
      <!-- Banner de Piada / Humor para Sáb/Dom -->
      <div id="humorBanner" class="hidden absolute -top-12 left-0 right-0 bg-amber-500/15 border border-amber-500/30 text-amber-200 text-xs px-4 py-2 rounded-xl text-center transition-all duration-300">
        ⚠️ <span id="humorText"></span>
      </div>

      <!-- ETAPA 1 -->
      <div id="pane1" class="step-pane active space-y-5">
        <h2 class="text-base font-bold text-white">Passo 1: Localidade e Meta</h2>
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-slate-400 block mb-1">Estado (UF)</label>
            <select id="inputUf" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
              <option value="PE" selected>Pernambuco (PE)</option>
              <option value="SP">São Paulo (SP)</option>
              <option value="RJ">Rio de Janeiro (RJ)</option>
              <option value="MG">Minas Gerais (MG)</option>
              <option value="BA">Bahia (BA)</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Município</label>
            <select id="inputCity" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
              <option value="Recife" selected>Recife</option>
            </select>
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-xs text-slate-400 block">Tipo de Meta</label>
          <div class="grid grid-cols-2 gap-2 bg-slate-950 p-1 rounded-xl border border-slate-800">
            <button type="button" id="btnModePct" class="py-2 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition">Porcentagem (%)</button>
            <button type="button" id="btnModeWk" class="py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">Dias por Semana</button>
          </div>
        </div>

        <div id="boxPct" class="space-y-2">
          <div class="flex justify-between items-center text-xs">
            <span class="text-slate-300">Meta Desejada (%):</span>
            <div class="flex items-center gap-1">
              <input type="number" id="numPct" min="10" max="100" step="5" value="40" class="w-16 bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-center font-bold text-indigo-400 text-xs focus:outline-none focus:border-indigo-500">
              <span class="text-indigo-400 font-bold">%</span>
            </div>
          </div>
          <input type="range" id="rangePct" min="10" max="100" step="5" value="40" class="w-full accent-indigo-500 cursor-pointer">
        </div>

        <div id="boxWk" class="space-y-2 hidden">
          <div class="flex justify-between items-center text-xs">
            <span class="text-slate-300">Frequência Semanal (dias):</span>
            <div class="flex items-center gap-1">
              <input type="number" id="numWk" min="1" max="7" step="1" value="2" class="w-16 bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-center font-bold text-indigo-400 text-xs focus:outline-none focus:border-indigo-500">
              <span class="text-indigo-400 font-bold">dias</span>
            </div>
          </div>
          <input type="range" id="rangeWk" min="1" max="7" step="1" value="2" class="w-full accent-indigo-500 cursor-pointer">
        </div>

        <div class="flex justify-end pt-3 border-t border-slate-800">
          <button type="button" id="toStep2" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold text-white transition">
            Avançar →
          </button>
        </div>
      </div>

      <!-- ETAPA 2 -->
      <div id="pane2" class="step-pane space-y-5">
        <h2 class="text-base font-bold text-white">Passo 2: Dias Preferidos</h2>
        <p class="text-xs text-
